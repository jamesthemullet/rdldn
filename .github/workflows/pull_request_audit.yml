name: CI Tests For Roast Dinners In London
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run Biome lint
        run: yarn lint
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run Astro Type Check
        run: yarn ts-check
  unit-tests:
    runs-on: ubuntu-latest
    env:
      PUBLIC_GRAPHQL_URL: https://blog.rdldn.co.uk/graphql
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run unit tests
        run: yarn test
  e2e-tests:
    runs-on: ubuntu-latest
    env:
      SCORE_SECRET: test-secret-for-ci
      PUBLIC_GRAPHQL_URL: https://blog.rdldn.co.uk/graphql
      DATABASE_URL: postgres://user:password@localhost:5432/test-db
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - name: Run end-to-end tests
        run: yarn test:e2e
  axe:
    runs-on: ubuntu-latest
    env:
      GITHUB_API_SECRET: ${{ secrets.PIPELINE_GITHUB_API_SECRET }}
      PUBLIC_GRAPHQL_URL: https://blog.rdldn.co.uk/graphql
      PLAYWRIGHT: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Get Chromium version 🌐
        run: |
          CHROMIUM_VERSION=$(wget -qO- https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE | cut -d. -f1)
          echo "Chromium version: $CHROMIUM_VERSION"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> $GITHUB_ENV
      - name: Setup Chrome 🌐
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ env.CHROMIUM_VERSION }}
      - name: Install chromedriver 🚗
        run: |
          echo "Installing chromedriver version: $CHROMIUM_VERSION"
          yarn add chromedriver@$CHROMIUM_VERSION
          echo "chromedriver version: $(chromedriver --version)"
      - run: yarn dev & npx wait-on http://localhost:4321 --timeout 60000
      - name: Run axe
        run: |
          yarn add @axe-core/cli
          CHROMIUM_VERSION=$(google-chrome --version | cut -d' ' -f3 | cut -d'.' -f1)
          yarn add chromedriver@$CHROMIUM_VERSION
          npx axe --chromedriver-path $(yarn bin)/chromedriver http://localhost:4321/ --load-delay=1500 --exit
