name: Knip
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
      - name: Install dependencies
        run: yarn install
      - name: Run Knip
        run: yarn knip
